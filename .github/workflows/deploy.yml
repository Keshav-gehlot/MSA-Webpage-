name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Type Check
        run: npm run lint
        
      - name: Build
        run: npm run build
        
      # Azure Static Web Apps / Vercel / Cloud Run deploy step would go here
      # depending on the final deployment target.
